<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dolomea — OS09 · Order</title>
<meta name="description" content="Dolomea — OS09. Order the 12&quot; vinyl from your preferred store." />

<!-- ============================================================
     EDIT YOUR LINKS IN THE  STORES  ARRAY NEAR THE BOTTOM ↓↓↓
     Each store has a URL — replace the placeholder search-links
     with the DIRECT product page once you have them.
     ============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..600&family=Spline+Sans+Mono:wght@300..600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0c0c12;
    --bg-2:#13131d;
    --ink:#ece8df;          /* warm off-white */
    --muted:#878493;
    --line:rgba(236,232,223,.12);
    --peri:#98a4ea;          /* periwinkle pulled from the label */
    --peri-soft:#aac3f1;
    --olive:#a7a76a;
    --card:rgba(255,255,255,.025);
    --radius:16px;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Spline Sans Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    line-height:1.5;
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }

  /* ---- atmosphere: drifting organic colour blobs + grain ---- */
  .atmos{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.42;mix-blend-mode:screen;animation:drift 26s ease-in-out infinite alternate}
  .blob.b1{width:46vmax;height:46vmax;left:-14vmax;top:-12vmax;background:radial-gradient(circle,#5560b8,transparent 68%)}
  .blob.b2{width:40vmax;height:40vmax;right:-12vmax;top:18vmax;background:radial-gradient(circle,#6f7044,transparent 66%);animation-delay:-9s}
  .blob.b3{width:38vmax;height:38vmax;left:8vmax;bottom:-16vmax;background:radial-gradient(circle,#3b4a86,transparent 70%);animation-delay:-15s}
  @keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(4vmax,3vmax,0) scale(1.12)}}
  .grain{position:fixed;inset:-200%;z-index:1;pointer-events:none;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    animation:grain 7s steps(6) infinite}
  @keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-6%,4%)}40%{transform:translate(3%,-7%)}60%{transform:translate(-4%,5%)}80%{transform:translate(5%,-3%)}100%{transform:translate(0,0)}}

  /* ---- shell ---- */
  .wrap{position:relative;z-index:2;max-width:520px;margin:0 auto;padding:clamp(28px,7vw,64px) 22px 56px;
    display:flex;flex-direction:column;align-items:center;text-align:center}

  .kicker{font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--muted);
    opacity:0;animation:rise .8s .05s cubic-bezier(.2,.7,.2,1) forwards}

  /* ---- vinyl hero ---- */
  .disc{position:relative;width:clamp(208px,62vw,272px);aspect-ratio:1;margin:22px 0 6px;
    opacity:0;animation:pop 1s .12s cubic-bezier(.2,.8,.2,1) forwards}
  .disc::after{content:"";position:absolute;inset:0;border-radius:50%;
    box-shadow:inset 0 0 60px rgba(0,0,0,.55), inset 0 6px 22px rgba(255,255,255,.10);pointer-events:none}
  .disc::before{content:"";position:absolute;inset:-9px;border-radius:50%;
    background:conic-gradient(from 0deg,rgba(255,255,255,.16),transparent 22%,rgba(0,0,0,.35) 50%,transparent 74%,rgba(255,255,255,.12));
    filter:blur(7px);opacity:.7;z-index:-1}
  .disc img{width:100%;height:100%;border-radius:50%;display:block;
    animation:spin 16s linear infinite;
    box-shadow:0 26px 60px -18px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.05)}
  .disc:hover img{animation-play-state:paused}
  .spindle{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;
    transform:translate(-50%,-50%);background:#08080c;box-shadow:0 0 0 3px rgba(236,232,223,.14),inset 0 0 4px rgba(0,0,0,.9)}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---- titles ---- */
  h1{font-family:"Fraunces",Georgia,serif;font-optical-sizing:auto;font-weight:560;
    font-size:clamp(58px,17vw,92px);line-height:.92;letter-spacing:-.015em;margin-top:14px;
    font-variation-settings:"SOFT" 40,"WONK" 1;
    opacity:0;animation:rise .85s .2s cubic-bezier(.2,.7,.2,1) forwards}
  h1 em{font-style:italic;color:var(--peri-soft)}
  .meta{margin-top:14px;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
    display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;
    opacity:0;animation:rise .85s .28s cubic-bezier(.2,.7,.2,1) forwards}
  .meta .dot{width:4px;height:4px;border-radius:50%;background:var(--olive);display:inline-block}
  .meta b{color:var(--ink);font-weight:500}

  /* ---- tracklist ---- */
  .tracks{margin:22px auto 4px;width:100%;max-width:340px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:13px 4px;display:grid;grid-template-columns:1fr 1fr;gap:7px 18px;text-align:left;
    opacity:0;animation:rise .85s .36s cubic-bezier(.2,.7,.2,1) forwards}
  .tracks .tk{font-size:12px;color:var(--muted);display:flex;gap:9px;align-items:baseline}
  .tracks .tk span{color:var(--peri);font-size:10.5px;letter-spacing:.1em;min-width:18px}
  .tracks .tk b{color:var(--ink);font-weight:400;font-family:"Fraunces",serif;font-size:14px;font-style:italic}

  /* ---- links ---- */
  .label-row{width:100%;display:flex;align-items:center;justify-content:space-between;
    margin:30px 2px 12px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);
    opacity:0;animation:rise .8s .42s forwards}
  .label-row::before,.label-row span.l{white-space:nowrap}

  #links{width:100%;display:flex;flex-direction:column;gap:9px}
  .row{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;
    padding:16px 18px;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--card);color:var(--ink);text-decoration:none;overflow:hidden;
    transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .35s;
    opacity:0;transform:translateY(14px);animation:rise .7s forwards}
  .row::before{content:"";position:absolute;inset:0;background:var(--peri);
    transform:translateY(101%);transition:transform .42s cubic-bezier(.66,0,.2,1);z-index:0}
  .row:hover{transform:translateY(-2px);border-color:transparent}
  .row:hover::before{transform:translateY(0)}
  .row > *{position:relative;z-index:1;transition:color .3s}
  .row:hover .store,.row:hover .idx,.row:hover .loc,.row:hover .arrow{color:#0c0c12}
  .idx{font-size:11px;color:var(--muted);letter-spacing:.05em}
  .store{font-family:"Fraunces",serif;font-weight:500;font-size:21px;letter-spacing:-.01em;text-align:left;line-height:1}
  .loc{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:right;line-height:1.3}
  .arrow{font-size:16px;color:var(--peri);transition:transform .35s cubic-bezier(.2,.8,.2,1),color .3s}
  .row:hover .arrow{transform:translateX(5px) rotate(-2deg)}
  .store small{display:block;font-family:"Spline Sans Mono",monospace;font-size:9.5px;font-weight:300;
    letter-spacing:.12em;text-transform:uppercase;color:var(--olive);margin-top:5px}
  .row:hover .store small{color:rgba(12,12,18,.6)}

  /* ---- footer ---- */
  footer{margin-top:38px;width:100%;text-align:center;color:var(--muted);font-size:10.5px;letter-spacing:.16em;
    opacity:0;animation:rise .9s .6s forwards}
  footer .rim{display:block;text-transform:uppercase;font-size:9px;letter-spacing:.34em;color:rgba(135,132,147,.5);
    max-width:300px;margin:0 auto 16px;line-height:1.9}
  footer a{color:var(--peri);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .3s}
  footer a:hover{border-color:var(--peri)}
  footer .credit{color:var(--ink);font-style:italic;font-family:"Fraunces",serif;text-transform:none;letter-spacing:0;font-size:13px}

  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  @keyframes pop{0%{opacity:0;transform:scale(.86) rotate(-6deg)}to{opacity:1;transform:scale(1) rotate(0)}}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important;animation-iteration-count:1!important}
    .disc img{animation:none}
  }
</style>
</head>
<body>
  <div class="atmos"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
  <div class="grain"></div>

  <main class="wrap">
    <div class="kicker">Out now · 12&quot; Vinyl</div>

    <div class="disc">
      <img src="cover_a1.jpg" alt="Dolomea — OS09 record label" />
      <span class="spindle"></span>
    </div>

    <h1>Dol<em>o</em>mea</h1>

    <div class="meta">
      <b>OS09</b><span class="dot"></span>Original Vinyl<span class="dot"></span><b>4 Tracks</b>
    </div>

    <div class="tracks" id="tracks"></div>

    <div class="label-row"><span class="l">Order the record</span><span class="l">Stores</span></div>
    <nav id="links" aria-label="Buy and stream links"></nav>

    <footer>
      <span class="rim">All rights of the manufacturer · authorized public performances · copying not prohibited</span>
      <span class="credit">Artwork — Louis Hay</span>
    </footer>
  </main>

<script>
/* ============================================================
   1) TRACKLIST  — edit freely
   ============================================================ */
const TRACKS = [
  ["A1","her mode"],
  ["A2","your grind"],
  ["B1","my secret"],
  ["B2","their flow"],
];

/* ============================================================
   2) STORES — ⚠️ REPLACE each `url` with the DIRECT product page.
      The current URLs are SEARCH placeholders so every button
      already works; swap them for the exact links when ready.
   ============================================================ */
const STORES = [
  { name:"Juno",      loc:"UK · Vinyl",        url:"https://www.juno.co.uk/search/?q%5Ball%5D%5B%5D=Dolomea" },
  { name:"Deejay.de", loc:"DE · Vinyl",        url:"https://www.deejay.de/search?searchText=Dolomea" },
  { name:"Decks.de",  loc:"DE · Vinyl",        url:"https://www.decks.de/search?search=Dolomea" },
  { name:"Red Eye",   loc:"UK · Vinyl",        url:"https://www.redeyerecords.co.uk/search?q=Dolomea" },
  { name:"Bandcamp",  loc:"Direct · Dig+Wax",  url:"https://bandcamp.com/search?q=Dolomea" },
  { name:"Discogs",   loc:"Marketplace",       url:"https://www.discogs.com/search/?q=Dolomea+OS09&type=release" },
];

/* ---- render tracklist ---- */
document.getElementById("tracks").innerHTML = TRACKS.map(
  ([pos,title]) => `<div class="tk"><span>${pos}</span><b>${title}</b></div>`
).join("");

/* ---- render store rows with staggered reveal ---- */
document.getElementById("links").innerHTML = STORES.map((s,i)=>`
  <a class="row" href="${s.url}" target="_blank" rel="noopener noreferrer"
     style="animation-delay:${0.46 + i*0.07}s">
    <span class="idx">${String(i+1).padStart(2,"0")}</span>
    <span class="store">${s.name}</span>
    <span class="loc">${s.loc}</span>
    <span class="arrow" aria-hidden="true">↗</span>
  </a>`).join("");
</script>
</body>
</html>
